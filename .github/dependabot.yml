version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "ProjectEuropa"
    assignees:
      - "ProjectEuropa"
    commit-message:
      prefix: "frontend"
      include: "scope"
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "vitest"
          - "playwright"
      development-dependencies:
        patterns:
          - "@types/*"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "vitest"
          - "playwright"
          - "@biomejs/*"
          - "husky"
          - "lint-staged"

  # Backend dependencies (hono-worker)
  - package-ecosystem: "npm"
    directory: "/hono-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "ProjectEuropa"
    assignees:
      - "ProjectEuropa"
    commit-message:
      prefix: "hono-worker"
      include: "scope"
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "@vitest/*"
          - "vitest"
          - "@biomejs/*"
          - "tsx"
          - "typescript"
          - "wrangler"
      development-dependencies:
        patterns:
          - "@types/*"
          - "@vitest/*"
          - "vitest"
          - "@biomejs/*"
          - "tsx"
          - "typescript"
          - "wrangler"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "ProjectEuropa"
    assignees:
      - "ProjectEuropa"
    commit-message:
      prefix: "ci"
      include: "scope"
